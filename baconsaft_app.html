  filter: drop-shadow(0 6px 24px rgba(30,120,200,0.5));
  animation: popIn 0.6s cubic-bezier(.22,1,.36,1) 0.2s both;
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.4); }
  to { opacity:1; transform:scale(1); }
}

.page { display: none; min-height: 100vh; flex-direction: column; align-items: center; }
.page.active { display: flex; }
.logo-wrap {
  position: sticky; top: 14px; left: 50%;
  transform: translateX(-50%); z-index: 100;
  cursor: pointer; width: fit-content; margin: 14px auto 0;
}
.logo-wrap img {
  height: 90px; display: block;
  filter: drop-shadow(0 4px 14px rgba(30,120,200,0.25));
  transition: transform 0.15s;
}
.logo-wrap:hover img { transform: scale(1.04); }
.home-content {
  padding-top: 20px; padding-bottom: 60px;
  width: 100%; max-width: 900px;
  padding-left: 20px; padding-right: 20px;
}
.cards-row { display: flex; gap: 20px; width: 100%; margin-top: 20px; }
.card {
  flex: 1; background: rgba(255,255,255,0.55);
  border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.8);
  box-shadow: 0 4px 24px rgba(30,100,200,0.10);
  padding: 22px 18px 18px;
  transition: transform 0.15s, box-shadow 0.15s;
  min-height: 500px;
  display: flex; flex-direction: column; align-items: flex-start;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(30,100,200,0.18); }
.card-logo { margin-bottom: 18px; cursor: pointer; }
.card-searchbar {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.85); border-radius: 11px;
  border: 1.5px solid rgba(30,140,220,0.25);
  padding: 7px 10px; width: 100%; margin-bottom: 14px;
  box-shadow: 0 2px 10px rgba(30,100,200,0.08);
}
.card-searchbar input {
  flex: 1; border: none; background: transparent;
  outline: none; font-size: 13px; color: #1a4f7a;
  margin: 0 8px; font-family: inherit;
}
.search-icon-btn {
  background: rgba(30,140,220,0.15); border-radius: 8px;
  padding: 5px 7px; display: flex; align-items: center;
  cursor: pointer; border: 1.5px solid rgba(30,140,220,0.25);
}
.discover-btn {
  display: flex; align-items: center; gap: 8px;
  background: rgba(31,168,224,0.13); border: 1.5px solid rgba(31,168,224,0.3);
  border-radius: 10px; padding: 9px 14px; cursor: pointer;
  font-size: 13px; color: #1a6fa8; font-weight: 600;
  transition: background 0.15s; width: 100%; margin-bottom: 10px;
}
.discover-btn:hover { background: rgba(31,168,224,0.22); }
.search-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 20px; padding-bottom: 40px; flex: 1; width: 100%;
}
.search-title { margin-bottom: 20px; filter: drop-shadow(0 4px 12px rgba(20,100,200,0.2)); }
.search-bar-big {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.72); border-radius: 13px;
  border: 2px solid rgba(30,140,220,0.28); padding: 9px 14px;
  width: min(500px, 86vw); margin-bottom: 24px;
  box-shadow: 0 3px 16px rgba(30,100,200,0.09);
}
.search-bar-big input {
  flex: 1; border: none; background: transparent;
  outline: none; font-size: 15px; color: #1a4f7a;
  margin: 0 10px; font-family: inherit;
}
.search-icon-btn-big {
  background: rgba(30,140,220,0.15); border-radius: 9px;
  padding: 7px 9px; display: flex; align-items: center;
  cursor: pointer; border: 1.5px solid rgba(30,140,220,0.3);
}
.results-container {
  width: min(860px, 94vw);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; padding-bottom: 40px;
}
.result-card {
  background: rgba(255,255,255,0.70); border-radius: 16px;
  border: 1.5px solid rgba(255,255,255,0.85);
  box-shadow: 0 3px 14px rgba(30,100,200,0.09);
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
  transition: transform 0.12s;
}
.result-card:hover { transform: translateY(-2px); }
.result-card img.mod-icon {
  width: 56px; height: 56px; border-radius: 10px;
  object-fit: cover;
}
.result-card .mod-name { font-size: 15px; font-weight: 700; color: #0e3a6a; }
.result-card .mod-author { font-size: 12px; color: #4a7fa8; }
.result-card .mod-desc {
  font-size: 12px; color: #2a5a7a; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.result-card .mod-downloads { font-size: 11px; color: #5a8fa8; }
.result-card .download-btn {
  display: inline-block; background: rgba(31,168,224,0.18);
  border: 1.5px solid rgba(31,168,224,0.4);
  border-radius: 8px; padding: 6px 12px;
  font-size: 12px; color: #1a6fa8; font-weight: 600;
  text-decoration: none; text-align: center;
  transition: background 0.15s;
}
.result-card .download-btn:hover { background: rgba(31,168,224,0.32); }
.loading-msg { color: #2a6fa8; font-size: 15px; margin-top: 20px; opacity: 0.8; }
.no-results { color: #2a6fa8; font-size: 15px; margin-top: 20px; opacity: 0.8; }
.discover-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 20px; padding-bottom: 40px; flex: 1; width: 100%;
}
.footer {
  text-align: center; padding: 20px 0 28px;
  font-size: 12px; color: #2a6fa8;
  letter-spacing: 0.1em; opacity: 0.75; font-weight: 600;
}
</style>
</head>

<script>
// ── PARTICLE INTRO ───────────────────────────────────────────
const pcanvas = document.getElementById('pcanvas');
const ctx = pcanvas.getContext('2d');
const introEl = document.getElementById('intro-canvas');

function resizeP() { pcanvas.width = window.innerWidth; pcanvas.height = window.innerHeight; }
resizeP();
window.addEventListener('resize', resizeP);

const N = 150;
let pts = [];
let mode = 'float'; // float -> gather -> done

function rand(a,b) { return a + Math.random()*(b-a); }

function initPts() {
  pts = [];
  for (let i = 0; i < N; i++) {
    pts.push({
      x: rand(0, pcanvas.width),
      y: rand(0, pcanvas.height),
      vx: rand(-1.5, 1.5),
      vy: rand(-1.5, 1.5),
      r: rand(3, 9),
      a: rand(0.4, 0.9),
      color: `hsl(${rand(188,222).toFixed(0)}, ${rand(70,90).toFixed(0)}%, ${rand(55,78).toFixed(0)}%)`,
    });
  }
}

let gatherT = 0;
const GATHER_MS = 1200;

function draw() {
  ctx.clearRect(0, 0, pcanvas.width, pcanvas.height);
  const cx = pcanvas.width / 2;
  const cy = pcanvas.height / 2;

  if (mode === 'float') {
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > pcanvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > pcanvas.height) p.vy *= -1;
      drawDot(p.x, p.y, p.r, p.color, p.a);
    });
  } else if (mode === 'gather') {
    gatherT += 16;
    const progress = Math.min(gatherT / GATHER_MS, 1);
    const ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
    pts.forEach(p => {
      p.x += (cx - p.x) * 0.04;
      p.y += (cy - p.y) * 0.04;
      const alpha = p.a * (1 - ease);
      if (alpha > 0.01) drawDot(p.x, p.y, p.r * (1 - ease * 0.5), p.color, alpha);
    });
    if (progress >= 1) {
      mode = 'done';
      // fade out intro overlay
      introEl.style.transition = 'opacity 0.7s ease';
      introEl.style.opacity = '0';
      setTimeout(() => { introEl.style.display = 'none'; }, 750);
      return;
    }
  }
  requestAnimationFrame(draw);
}

function drawDot(x, y, r, color, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = color;
  ctx.shadowBlur = 12;
  ctx.shadowColor = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

initPts();
draw();
// after 1.8s start gathering
setTimeout(() => { mode = 'gather'; }, 1800);

// ── NAVIGATION ───────────────────────────────────────────────
function goTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  window.scrollTo(0, 0);
}

function searchGo(type) {
  const val = document.getElementById(type === 'mods' ? 'mods-input' : 'tp-input').value;
  goTo(type);
  const target = document.getElementById(type === 'mods' ? 'mods-search-page' : 'tp-search-page');
  target.value = val;
  target.focus();
  if (val.trim()) doSearch(type);
}

async function doSearch(type) {
  const isMods = type === 'mods';
  const query = document.getElementById(isMods ? 'mods-search-page' : 'tp-search-page').value.trim();
  const container = document.getElementById(isMods ? 'mods-results' : 'tp-results');
  if (!query) return;
  container.innerHTML = '<p class="loading-msg">Suche läuft...</p>';
  const facets = isMods ? '[["project_type:mod"]]' : '[["project_type:resourcepack"]]';
  const url = `https://api.modrinth.com/v2/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(facets)}&limit=20&index=relevance`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    renderResults(container, data.hits);
  } catch(e) {
    container.innerHTML = '<p class="no-results">Fehler beim Laden.</p>';
  }
}

async function discoverGo(type) {
  const isMods = type === 'mods';
  const pageId = isMods ? 'discover-mods' : 'discover-texturepacks';
  goTo(pageId);
  const container = document.getElementById(isMods ? 'discover-mods-results' : 'discover-tp-results');
  container.innerHTML = '<p class="loading-msg">Lade beliebte Inhalte...</p>';
  const facets = isMods ? '[["project_type:mod"]]' : '[["project_type:resourcepack"]]';
  const url = `https://api.modrinth.com/v2/search?facets=${encodeURIComponent(facets)}&limit=20&index=downloads`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    renderResults(container, data.hits);
  } catch(e) {
    container.innerHTML = '<p class="no-results">Fehler beim Laden.</p>';
  }
}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n;
}

function renderResults(container, hits) {
  if (!hits || hits.length === 0) {
    container.innerHTML = '<p class="no-results">Keine Ergebnisse gefunden.</p>';
    return;
  }
  container.innerHTML = hits.map(h => {
    const icon = h.icon_url ? `<img class="mod-icon" src="${h.icon_url}" alt="${h.title}" onerror="this.style.display='none'">` : '';
    const dlUrl = `https://modrinth.com/${h.project_type}/${h.slug}`;
    return `<div class="result-card">
      ${icon}
      <div class="mod-name">${h.title}</div>
      <div class="mod-author">von ${h.author}</div>
      <div class="mod-desc">${h.description}</div>
      <div class="mod-downloads">⬇ ${formatNum(h.downloads)} Downloads</div>
      <a class="download-btn" href="${dlUrl}" target="_blank">Auf Modrinth öffnen ↗</a>
    </div>`;
  }).join('');
}
</script>
